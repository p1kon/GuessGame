server {
    listen 80 default_server;
    server_name 67.21.76.143;
    location /.well-known/acme-challenge/ { root /var/www/guessgame-acme; }
    location / { return 301 https://67.21.76.143$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name 67.21.76.143;
    ssl_certificate /etc/letsencrypt/live/guessgame-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guessgame-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    server_tokens off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
